<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Heatwave banner">
  <defs>
    <linearGradient id="deepcyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07333a"/>
      <stop offset="1" stop-color="#03181c"/>
    </linearGradient>
    <linearGradient id="heatline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#ffd97a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#deepcyan)"/>
  <!-- decaying temperature wave snapshots on LEFT, wordmark RIGHT -->
  <g transform="translate(80,40)">
    <line x1="30" y1="200" x2="540" y2="200" stroke="#4f8a8f" stroke-width="2"/>
    <!-- successive sin(pi x) e^{-pi^2 t} snapshots, fading -->
    <path d="M 40 60 Q 160 30 285 60 Q 410 92 510 190" stroke="#ffd97a" stroke-width="3.5" fill="none" opacity="0.95"/>
    <path d="M 40 105 Q 160 92 285 112 Q 410 140 510 194" stroke="#ff8a3c" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M 40 145 Q 160 140 285 150 Q 410 168 510 197" stroke="#e86a3c" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 40 172 Q 160 170 285 175 Q 410 184 510 199" stroke="#c04a3c" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- time arrow -->
    <line x1="200" y1="228" x2="480" y2="228" stroke="#4f8a8f" stroke-width="2" marker-end="url(#hwarr)"/>
    <defs>
      <marker id="hwarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#4f8a8f"/>
      </marker>
    </defs>
    <text x="40" y="234" fill="#8fc9ce" font-family="Consolas, monospace" font-size="15">t →  decay</text>
    <text x="300" y="40" fill="#ffd97a" font-family="Consolas, monospace" font-size="15" text-anchor="middle">u(x,t) = sin(πx)·e^(−π²t)</text>
    <text x="300" y="258" fill="#4f8a8f" font-family="Consolas, monospace" font-size="13" text-anchor="middle">FTCS guarded · backward Euler · Thomas solver · Octave</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="660" y="118" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="2">Heatwave</text>
    <text x="662" y="162" fill="#8fc9ce" font-size="21">transient heat diffusion in toolbox-free GNU Octave</text>
    <text x="662" y="200" fill="#4f7f84" font-family="Consolas, monospace" font-size="15">implicit stable at 32× the FTCS limit</text>
  </g>
</svg>
